<script>
  const state = {
    cases: [],
    team: [],
    columns: [],
    columnTypes: ['text', 'number', 'date', 'link', 'dropdown', 'checkbox'],
    filterText: '',
    filterMemberId: ''
  };

  function memberById(id) {
    if (id == null || id === '') return null;
    const target = String(id).trim();
    return state.team.find(t => String(t.MemberId).trim() === target) || null;
  }

  /* ---------- Server bridge ---------- */
  function call(method, ...args) {
    showLoader(true);
    return new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler(r => { showLoader(false); resolve(r); })
        .withFailureHandler(e => { showLoader(false); reject(e); })
        [method](...args);
    });
  }

  /* ---------- Bootstrap ---------- */
  document.addEventListener('DOMContentLoaded', async () => {
    bindTabs();
    bindCaseModal();
    bindTeamForm();
    bindColumnForm();
    bindImportModal();
    bindFilters();
    try {
      const data = await call('getDashboardData');
      applyData(data);
    } catch (e) {
      toast('Failed to load: ' + (e.message || e), 'error');
    }
  });

  function applyData(data) {
    state.cases = data.cases || [];
    state.team = data.team || [];
    state.columns = data.columns || [];
    state.columnTypes = data.columnTypes || state.columnTypes;
    renderAll();
  }

  function renderAll() {
    renderCases();
    renderTeam();
    renderColumns();
    renderInitialsFilter();
    renderColumnTypeOptions();
  }

  /* ---------- Tabs ---------- */
  function bindTabs() {
    document.querySelectorAll('.tab').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        btn.classList.add('active');
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        document.getElementById(btn.dataset.tab).classList.add('active');
      });
    });
  }

  /* ---------- Cases rendering ---------- */
  function caseColumns() {
    return [
      { key: 'MemberId', label: 'Member', type: 'member' },
      { key: 'MainLink', label: 'Main Link', type: 'link' },
      ...state.columns.map(c => ({
        key: c.ColumnName,
        label: c.ColumnName,
        type: String(c.ColumnType || 'text').toLowerCase(),
        options: c.Options
      }))
    ];
  }

  function renderCases() {
    const cols = caseColumns();
    const head = document.getElementById('cases-head');
    head.innerHTML = cols.map(c => `<th>${escapeHtml(c.label)}</th>`).join('') + '<th></th>';

    const filterText = state.filterText.toLowerCase();
    const filtered = state.cases.filter(row => {
      if (state.filterMemberId && String(row.MemberId || '').trim() !== state.filterMemberId) return false;
      if (!filterText) return true;
      const member = memberById(row.MemberId);
      const memberText = member ? `${member.Initials} ${member.Name}` : '';
      return Object.values(row).concat(memberText).some(v => String(v || '').toLowerCase().includes(filterText));
    });

    const body = document.getElementById('cases-body');
    body.innerHTML = filtered.map(row => {
      const cells = cols.map(c => `<td>${renderCell(c, row[c.key])}</td>`).join('');
      const actions = `<td class="row-actions">
        <button class="icon" title="Edit" data-action="edit" data-id="${escapeAttr(row.ID)}">&#9998;</button>
        <button class="danger" title="Delete" data-action="delete" data-id="${escapeAttr(row.ID)}">&#10005;</button>
      </td>`;
      return `<tr>${cells}${actions}</tr>`;
    }).join('');

    document.getElementById('cases-empty').classList.toggle('hidden', state.cases.length > 0);

    body.querySelectorAll('button[data-action]').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.dataset.id;
        if (btn.dataset.action === 'edit') openCaseModal(state.cases.find(c => String(c.ID) === String(id)));
        if (btn.dataset.action === 'delete') confirmDeleteCase(id);
      });
    });
  }

  function renderCell(col, value) {
    if (col.type === 'member') {
      const member = memberById(value);
      if (!member) {
        return value ? `<span class="initials-pill missing" title="Unknown member">${escapeHtml(value)}</span>` : '';
      }
      const title = `${member.Name}${member.Role ? ' — ' + member.Role : ''}`;
      return `<span class="initials-pill" title="${escapeAttr(title)}">${escapeHtml(member.Initials)}</span>`;
    }
    if (value == null || value === '') return '';
    if (col.type === 'link') {
      const href = String(value);
      const safe = /^https?:\/\//i.test(href) ? href : 'https://' + href;
      return `<a href="${escapeAttr(safe)}" target="_blank" rel="noopener">${escapeHtml(value)}</a>`;
    }
    if (col.type === 'checkbox') {
      const truthy = value === true || value === 'true' || value === 'TRUE' || value === 1 || value === '1';
      return truthy ? '&#9989;' : '';
    }
    if (col.type === 'date' && value) {
      const d = new Date(value);
      if (!isNaN(d)) return d.toLocaleDateString();
    }
    return escapeHtml(String(value));
  }

  function renderInitialsFilter() {
    const sel = document.getElementById('filter-initials');
    const current = sel.value;
    const opts = state.team.map(t =>
      `<option value="${escapeAttr(t.MemberId)}">${escapeHtml(t.Initials)} — ${escapeHtml(t.Name || '')}</option>`
    ).join('');
    sel.innerHTML = '<option value="">All team members</option>' + opts;
    if (current) sel.value = current;
  }

  /* ---------- Filters ---------- */
  function bindFilters() {
    document.getElementById('filter').addEventListener('input', e => {
      state.filterText = e.target.value;
      renderCases();
    });
    document.getElementById('filter-initials').addEventListener('change', e => {
      state.filterMemberId = e.target.value.trim();
      renderCases();
    });
  }

  /* ---------- Case modal ---------- */
  function bindCaseModal() {
    document.getElementById('add-case-btn').addEventListener('click', () => openCaseModal(null));
    document.getElementById('case-cancel').addEventListener('click', closeCaseModal);
    document.getElementById('case-form').addEventListener('submit', onCaseSubmit);
    document.getElementById('case-modal').addEventListener('click', e => {
      if (e.target.id === 'case-modal') closeCaseModal();
    });
  }

  function openCaseModal(existing) {
    const form = document.getElementById('case-form');
    form.reset();
    document.getElementById('case-modal-title').textContent = existing ? 'Edit Case' : 'Add Case';
    form.elements.ID.value = existing ? existing.ID : '';

    const fields = document.getElementById('case-fields');
    fields.innerHTML = caseColumns().map(c => fieldHtml(c, existing ? existing[c.key] : '')).join('');
    document.getElementById('case-modal').classList.remove('hidden');
  }

  function fieldHtml(col, value) {
    const v = value == null ? '' : String(value);
    if (col.type === 'member') {
      const opts = state.team.map(t =>
        `<option value="${escapeAttr(t.MemberId)}" ${String(t.MemberId) === v ? 'selected' : ''}>${escapeHtml(t.Initials)} — ${escapeHtml(t.Name || '')}</option>`
      ).join('');
      return `<div class="field"><label>${escapeHtml(col.label)}</label>
        <select name="${escapeAttr(col.key)}" required><option value="">Select team member...</option>${opts}</select></div>`;
    }
    if (col.type === 'dropdown') {
      const choices = String(col.options || '').split(',').map(s => s.trim()).filter(Boolean);
      const opts = choices.map(o => `<option value="${escapeAttr(o)}" ${o === v ? 'selected' : ''}>${escapeHtml(o)}</option>`).join('');
      return `<div class="field"><label>${escapeHtml(col.label)}</label>
        <select name="${escapeAttr(col.key)}"><option value="">—</option>${opts}</select></div>`;
    }
    if (col.type === 'date') {
      const dv = v ? new Date(v) : null;
      const iso = dv && !isNaN(dv) ? dv.toISOString().slice(0, 10) : '';
      return `<div class="field"><label>${escapeHtml(col.label)}</label>
        <input type="date" name="${escapeAttr(col.key)}" value="${escapeAttr(iso)}"></div>`;
    }
    if (col.type === 'number') {
      return `<div class="field"><label>${escapeHtml(col.label)}</label>
        <input type="number" step="any" name="${escapeAttr(col.key)}" value="${escapeAttr(v)}"></div>`;
    }
    if (col.type === 'checkbox') {
      const checked = v === 'true' || v === 'TRUE' || v === '1' || v === 'on' || value === true;
      return `<div class="field"><label>${escapeHtml(col.label)}</label>
        <input type="checkbox" name="${escapeAttr(col.key)}" ${checked ? 'checked' : ''}></div>`;
    }
    if (col.type === 'link' || col.key === 'MainLink') {
      return `<div class="field"><label>${escapeHtml(col.label)}</label>
        <input type="url" name="${escapeAttr(col.key)}" value="${escapeAttr(v)}" placeholder="https://..."></div>`;
    }
    return `<div class="field"><label>${escapeHtml(col.label)}</label>
      <input type="text" name="${escapeAttr(col.key)}" value="${escapeAttr(v)}"></div>`;
  }

  function closeCaseModal() {
    document.getElementById('case-modal').classList.add('hidden');
  }

  async function onCaseSubmit(e) {
    e.preventDefault();
    const form = e.target;
    const payload = {};
    caseColumns().forEach(c => {
      const el = form.elements[c.key];
      if (!el) return;
      if (el.type === 'checkbox') payload[c.key] = el.checked;
      else payload[c.key] = el.value;
    });
    if (form.elements.ID.value) payload.ID = form.elements.ID.value;
    try {
      if (payload.ID) {
        await call('updateCase', payload);
        toast('Case updated', 'success');
      } else {
        await call('addCase', payload);
        toast('Case added', 'success');
      }
      closeCaseModal();
      state.cases = await call('getCases');
      renderCases();
    } catch (err) {
      toast('Save failed: ' + (err.message || err), 'error');
    }
  }

  async function confirmDeleteCase(id) {
    if (!confirm('Delete this case?')) return;
    try {
      await call('deleteCase', id);
      state.cases = state.cases.filter(c => String(c.ID) !== String(id));
      renderCases();
      toast('Deleted', 'success');
    } catch (err) {
      toast('Delete failed: ' + (err.message || err), 'error');
    }
  }

  /* ---------- Team ---------- */
  function bindTeamForm() {
    document.getElementById('team-form').addEventListener('submit', async e => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const payload = {
        MemberId: fd.get('MemberId'),
        Initials: fd.get('Initials'),
        Name: fd.get('Name'),
        Role: fd.get('Role')
      };
      try {
        await call('saveTeamMember', payload);
        e.target.reset();
        state.team = await call('getTeamMembers');
        renderTeam();
        renderInitialsFilter();
        toast('Saved', 'success');
      } catch (err) {
        toast('Save failed: ' + (err.message || err), 'error');
      }
    });
  }

  function renderTeam() {
    const body = document.getElementById('team-body');
    if (!state.team.length) {
      body.innerHTML = '<tr><td colspan="5" class="empty">No team members yet.</td></tr>';
      return;
    }
    body.innerHTML = state.team.map(t => teamRowHtml(t, false)).join('');
    bindTeamRowEvents();
  }

  function teamRowHtml(t, editing) {
    const key = escapeAttr(t.MemberId);
    if (editing) {
      return `
        <tr data-key="${key}" data-editing="true">
          <td><input type="text" data-field="MemberId" value="${escapeAttr(t.MemberId)}" required></td>
          <td><input type="text" data-field="Initials" value="${escapeAttr(t.Initials)}" maxlength="6" required style="width:80px"></td>
          <td><input type="text" data-field="Name" value="${escapeAttr(t.Name || '')}" required></td>
          <td><input type="text" data-field="Role" value="${escapeAttr(t.Role || '')}"></td>
          <td class="row-actions">
            <button class="primary" data-action="save-team" data-key="${key}">Save</button>
            <button class="ghost" data-action="cancel-team" data-key="${key}">Cancel</button>
          </td>
        </tr>`;
    }
    return `
      <tr data-key="${key}">
        <td><code class="muted small">${escapeHtml(t.MemberId)}</code></td>
        <td><span class="initials-pill">${escapeHtml(t.Initials)}</span></td>
        <td>${escapeHtml(t.Name || '')}</td>
        <td>${escapeHtml(t.Role || '')}</td>
        <td class="row-actions">
          <button class="icon" data-action="edit-team" data-key="${key}" title="Edit">&#9998;</button>
          <button class="danger" data-action="delete-team" data-key="${key}" title="Delete">&#10005;</button>
        </td>
      </tr>`;
  }

  function bindTeamRowEvents() {
    const body = document.getElementById('team-body');
    body.querySelectorAll('button[data-action]').forEach(btn => {
      btn.addEventListener('click', () => handleTeamAction(btn.dataset.action, btn.dataset.key, btn));
    });
    body.querySelectorAll('tr[data-editing="true"] input').forEach(inp => {
      inp.addEventListener('keydown', e => {
        if (e.key === 'Enter') {
          e.preventDefault();
          const row = inp.closest('tr');
          handleTeamAction('save-team', row.dataset.key);
        } else if (e.key === 'Escape') {
          const row = inp.closest('tr');
          handleTeamAction('cancel-team', row.dataset.key);
        }
      });
    });
    const firstInput = body.querySelector('tr[data-editing="true"] input[data-field="MemberId"]');
    if (firstInput) firstInput.focus();
  }

  async function handleTeamAction(action, key) {
    const member = state.team.find(t => String(t.MemberId) === String(key));
    if (action === 'edit-team') {
      const body = document.getElementById('team-body');
      body.querySelectorAll('tr[data-editing="true"]').forEach(tr => {
        const orig = state.team.find(t => String(t.MemberId) === String(tr.dataset.key));
        if (orig) tr.outerHTML = teamRowHtml(orig, false);
      });
      const row = body.querySelector(`tr[data-key="${cssEscape(key)}"]`);
      if (row && member) row.outerHTML = teamRowHtml(member, true);
      bindTeamRowEvents();
      return;
    }
    if (action === 'cancel-team') {
      const row = document.querySelector(`#team-body tr[data-key="${cssEscape(key)}"]`);
      if (row && member) row.outerHTML = teamRowHtml(member, false);
      bindTeamRowEvents();
      return;
    }
    if (action === 'save-team') {
      const row = document.querySelector(`#team-body tr[data-key="${cssEscape(key)}"][data-editing="true"]`);
      if (!row) return;
      const newMemberId = row.querySelector('[data-field="MemberId"]').value.trim();
      const newInitials = row.querySelector('[data-field="Initials"]').value.trim();
      const newName = row.querySelector('[data-field="Name"]').value.trim();
      const newRole = row.querySelector('[data-field="Role"]').value.trim();
      if (!newMemberId || !newInitials || !newName) {
        toast('Member ID, Initials, and Name are required', 'error');
        return;
      }
      try {
        await call('updateTeamMember', {
          OriginalMemberId: key,
          MemberId: newMemberId,
          Initials: newInitials,
          Name: newName,
          Role: newRole
        });
        const data = await call('getDashboardData');
        applyData(data);
        toast('Updated', 'success');
      } catch (err) {
        toast('Update failed: ' + (err.message || err), 'error');
      }
      return;
    }
    if (action === 'delete-team') {
      if (!confirm('Remove this member? Cases linked to them will keep their MemberId until reassigned.')) return;
      try {
        await call('deleteTeamMember', key);
        state.team = state.team.filter(t => String(t.MemberId) !== String(key));
        renderTeam();
        renderInitialsFilter();
        toast('Removed', 'success');
      } catch (err) {
        toast('Delete failed: ' + (err.message || err), 'error');
      }
    }
  }

  function cssEscape(s) {
    if (window.CSS && CSS.escape) return CSS.escape(s);
    return String(s).replace(/[^a-zA-Z0-9_-]/g, '\\$&');
  }

  /* ---------- Custom columns ---------- */
  function renderColumnTypeOptions() {
    const sel = document.getElementById('column-type');
    sel.innerHTML = state.columnTypes.map(t => `<option value="${escapeAttr(t)}">${escapeHtml(t)}</option>`).join('');
    toggleOptionsField();
  }

  function toggleOptionsField() {
    const type = document.getElementById('column-type').value;
    const opts = document.getElementById('column-options');
    opts.disabled = type !== 'dropdown';
    if (type !== 'dropdown') opts.value = '';
  }

  function bindColumnForm() {
    document.getElementById('column-type').addEventListener('change', toggleOptionsField);
    document.getElementById('column-cancel').addEventListener('click', resetColumnForm);
    document.getElementById('column-form').addEventListener('submit', async e => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const payload = {
        ColumnId: fd.get('ColumnId') || null,
        ColumnName: fd.get('ColumnName'),
        ColumnType: fd.get('ColumnType'),
        Options: fd.get('Options') || ''
      };
      try {
        await call('saveColumn', payload);
        resetColumnForm();
        const data = await call('getDashboardData');
        applyData(data);
        toast('Column saved', 'success');
      } catch (err) {
        toast('Save failed: ' + (err.message || err), 'error');
      }
    });
  }

  function resetColumnForm() {
    const f = document.getElementById('column-form');
    f.reset();
    f.elements.ColumnId.value = '';
    document.getElementById('column-cancel').classList.add('hidden');
    toggleOptionsField();
  }

  function startEditColumn(col) {
    const f = document.getElementById('column-form');
    f.elements.ColumnId.value = col.ColumnId;
    f.elements.ColumnName.value = col.ColumnName;
    f.elements.ColumnType.value = String(col.ColumnType || 'text').toLowerCase();
    f.elements.Options.value = col.Options || '';
    toggleOptionsField();
    document.getElementById('column-cancel').classList.remove('hidden');
    document.querySelector('[name="ColumnName"]').focus();
  }

  function renderColumns() {
    const body = document.getElementById('columns-body');
    if (!state.columns.length) {
      body.innerHTML = '<tr><td colspan="5" class="empty">No custom columns yet.</td></tr>';
      return;
    }
    body.innerHTML = state.columns.map((c, i) => `
      <tr>
        <td>
          <button class="icon" data-id="${escapeAttr(c.ColumnId)}" data-dir="up" title="Move up" ${i === 0 ? 'disabled' : ''}>&#8593;</button>
          <button class="icon" data-id="${escapeAttr(c.ColumnId)}" data-dir="down" title="Move down" ${i === state.columns.length - 1 ? 'disabled' : ''}>&#8595;</button>
        </td>
        <td>${escapeHtml(c.ColumnName)}</td>
        <td><span class="muted small">${escapeHtml(c.ColumnType)}</span></td>
        <td><span class="muted small">${escapeHtml(c.Options || '')}</span></td>
        <td class="row-actions">
          <button class="icon" data-edit="${escapeAttr(c.ColumnId)}" title="Edit">&#9998;</button>
          <button class="danger" data-delete="${escapeAttr(c.ColumnId)}" title="Delete">&#10005;</button>
        </td>
      </tr>
    `).join('');

    body.querySelectorAll('button[data-edit]').forEach(b => {
      b.addEventListener('click', () => startEditColumn(state.columns.find(x => x.ColumnId === b.dataset.edit)));
    });
    body.querySelectorAll('button[data-delete]').forEach(b => {
      b.addEventListener('click', async () => {
        if (!confirm('Remove this column from the dashboard? Underlying data in the sheet is preserved.')) return;
        try {
          await call('deleteColumn', b.dataset.delete);
          const data = await call('getDashboardData');
          applyData(data);
          toast('Column deleted', 'success');
        } catch (err) {
          toast('Delete failed: ' + (err.message || err), 'error');
        }
      });
    });
    body.querySelectorAll('button[data-dir]').forEach(b => {
      b.addEventListener('click', () => moveColumn(b.dataset.id, b.dataset.dir));
    });
  }

  async function moveColumn(id, dir) {
    const idx = state.columns.findIndex(c => c.ColumnId === id);
    if (idx === -1) return;
    const swap = dir === 'up' ? idx - 1 : idx + 1;
    if (swap < 0 || swap >= state.columns.length) return;
    const arr = state.columns.slice();
    [arr[idx], arr[swap]] = [arr[swap], arr[idx]];
    try {
      await call('reorderColumns', arr.map(c => c.ColumnId));
      const data = await call('getDashboardData');
      applyData(data);
    } catch (err) {
      toast('Reorder failed: ' + (err.message || err), 'error');
    }
  }

  /* ---------- Bulk column import ---------- */
  let importSource = 'url';
  let importParsedItems = [];

  function bindImportModal() {
    const modal = document.getElementById('import-modal');
    document.getElementById('bulk-import-btn').addEventListener('click', () => {
      document.getElementById('import-url').value = '';
      document.getElementById('import-tab').value = '';
      document.getElementById('import-csv').value = '';
      document.getElementById('import-preview').classList.add('hidden');
      document.getElementById('import-preview-body').innerHTML = '';
      document.getElementById('import-confirm').disabled = true;
      document.getElementById('import-confirm').textContent = 'Import';
      importParsedItems = [];
      setImportSource('url');
      modal.classList.remove('hidden');
    });
    document.getElementById('import-cancel').addEventListener('click', () => modal.classList.add('hidden'));
    modal.addEventListener('click', e => { if (e.target.id === 'import-modal') modal.classList.add('hidden'); });
    document.querySelectorAll('#import-source-tabs .tab').forEach(t => {
      t.addEventListener('click', () => setImportSource(t.dataset.source));
    });
    document.getElementById('import-preview-btn').addEventListener('click', onImportPreview);
    document.getElementById('import-confirm').addEventListener('click', onImportConfirm);
  }

  function setImportSource(s) {
    importSource = s;
    document.querySelectorAll('#import-source-tabs .tab').forEach(t => {
      t.classList.toggle('active', t.dataset.source === s);
    });
    document.getElementById('import-url-pane').classList.toggle('hidden', s !== 'url');
    document.getElementById('import-csv-pane').classList.toggle('hidden', s !== 'csv');
    document.getElementById('import-preview').classList.add('hidden');
    document.getElementById('import-confirm').disabled = true;
  }

  async function onImportPreview() {
    try {
      let result;
      if (importSource === 'url') {
        const url = document.getElementById('import-url').value.trim();
        const tab = document.getElementById('import-tab').value.trim();
        if (!url) { toast('Enter a Google Sheet URL', 'error'); return; }
        result = await call('previewColumnsFromSheet', url, tab);
      } else {
        const csv = document.getElementById('import-csv').value;
        if (!csv.trim()) { toast('Paste some CSV first', 'error'); return; }
        result = await call('previewColumnsFromText', csv);
      }
      renderImportPreview(result);
    } catch (err) {
      toast('Preview failed: ' + (err.message || err), 'error');
    }
  }

  function renderImportPreview(result) {
    importParsedItems = (result && result.items) || [];
    const body = document.getElementById('import-preview-body');
    if (!importParsedItems.length) {
      body.innerHTML = '<tr><td colspan="4" class="empty">No rows found.</td></tr>';
    } else {
      body.innerHTML = importParsedItems.map(it => `
        <tr>
          <td>${escapeHtml(it.ColumnName)}</td>
          <td><span class="muted small">${escapeHtml(it.ColumnType)}</span></td>
          <td><span class="muted small">${escapeHtml(it.Options || '')}</span></td>
          <td>${it.valid
            ? '<span class="muted small">OK</span>'
            : `<span class="initials-pill missing" title="${escapeAttr(it.error || '')}">error</span>`}</td>
        </tr>
      `).join('');
    }
    document.getElementById('import-preview').classList.remove('hidden');
    const validCount = importParsedItems.filter(i => i.valid).length;
    const btn = document.getElementById('import-confirm');
    btn.disabled = validCount === 0;
    btn.textContent = validCount > 0 ? `Import ${validCount} column${validCount === 1 ? '' : 's'}` : 'Import';
  }

  async function onImportConfirm() {
    try {
      let result;
      if (importSource === 'url') {
        const url = document.getElementById('import-url').value.trim();
        const tab = document.getElementById('import-tab').value.trim();
        result = await call('importColumnsFromSheet', url, tab);
      } else {
        const csv = document.getElementById('import-csv').value;
        result = await call('importColumnsFromText', csv);
      }
      document.getElementById('import-modal').classList.add('hidden');
      const data = await call('getDashboardData');
      applyData(data);
      const errs = (result.errors || []).length;
      const msg = `Added ${result.added}, skipped ${result.skipped}` + (errs ? `, ${errs} error(s)` : '');
      toast(msg, result.added > 0 ? 'success' : 'error');
    } catch (err) {
      toast('Import failed: ' + (err.message || err), 'error');
    }
  }

  /* ---------- Helpers ---------- */
  function escapeHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function escapeAttr(s) { return escapeHtml(s); }

  let toastTimer = null;
  function toast(msg, kind) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = 'toast' + (kind ? ' ' + kind : '');
    el.classList.remove('hidden');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.add('hidden'), 2800);
  }

  let loaderCount = 0;
  function showLoader(on) {
    loaderCount += on ? 1 : -1;
    if (loaderCount < 0) loaderCount = 0;
    document.getElementById('loader').classList.toggle('hidden', loaderCount === 0);
  }
</script>
